<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G01 X05 — probe tổng hợp</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#0b1322;color:#edf4fc;font:15px Arial,sans-serif}body[data-theme=light]{background:#eff4fa;color:#172238}h1{font-size:24px}button,input{font:inherit;padding:9px;border:1px solid #7894b1;border-radius:5px}button{background:#234563;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f8ba50;outline-offset:2px}nav{display:flex;gap:8px;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;margin-top:16px}#viewport{min-height:440px}#viewport canvas{display:block;max-width:100%}#list{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto;margin:12px 0}#params{display:grid;gap:8px}label{display:grid;gap:4px}input{width:100%}#scope,#row,#browser{overflow-wrap:anywhere}#browser{color:#c6882b;font-weight:bold}body[data-theme=light] #browser{color:#724500}@media(max-width:700px){body{padding:12px}main{grid-template-columns:minmax(0,1fr)}#params{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style>
<body data-theme="dark"><h1>G01 · X05 — khảo sát renderer</h1><p id="browser">Đang xác minh browser…</p><p>Dữ liệu tổng hợp · dataset-A / A-V0 · Chỉ điều hướng, chưa chạy xử lý sản phẩm</p><nav><button id="mode">Chuyển 2D</button><button id="theme">Đổi sáng/tối</button><button id="reset">Đặt lại góc nhìn</button><label><input id="motion" type="checkbox">Giảm chuyển động</label></nav><p id="status" role="status">Sẵn sàng chọn khối; chưa có thao tác chạy</p><p>Đang chọn: <span id="selection">stage-0</span></p><main><section><div id="viewport" aria-label="Khung nhìn phối cảnh 3D"></div><p id="scope"></p><div id="list" aria-label="Danh sách 2D tương đương"></div><p id="row"></p></section><aside><h2>Cấu hình fixture</h2><p>Mọi tham số hiện rõ; không tự chạy khi chọn khối.</p><form id="params" onsubmit="return false"></form></aside></main><script type="module" src="/x05-bundle.mjs"></script></body></html>
